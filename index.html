<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#000}
#stage{position:fixed;inset:0;background:#000;display:flex;align-items:center;justify-content:center;cursor:pointer}
.dot{position:absolute;width:64px;height:64px;background:transparent;border:5px solid #e00;border-radius:50%;box-shadow:0 0 18px 4px rgba(220,0,0,0.5);opacity:0;animation:dotPulse 1.8s ease forwards;cursor:pointer;z-index:10}
@keyframes dotPulse{0%{transform:scale(0) translate(-50%,-50%);opacity:0}40%{transform:scale(1.4) translate(-50%,-50%);opacity:1;box-shadow:0 0 24px 8px rgba(255,50,50,0.9)}70%{transform:scale(1) translate(-50%,-50%);opacity:1}100%{transform:scale(1) translate(-50%,-50%);opacity:1}}@keyframes dotGlow{0%,100%{box-shadow:0 0 12px 4px rgba(220,0,0,0.5)}50%{box-shadow:0 0 24px 8px rgba(255,0,0,0.8)}}
.quote-reveal{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 28px;text-align:center;opacity:0;pointer-events:none;transition:opacity 1.2s ease}
.quote-reveal.show{opacity:1;pointer-events:all}
.photo-frame{width:200px;height:240px;object-fit:cover;border:1px solid rgba(255,100,100,0.3);box-shadow:0 0 40px rgba(200,0,0,0.2);margin-bottom:28px;opacity:0;transform:translateY(20px) scale(0.95);transition:opacity 1s ease 0.3s,transform 1s ease 0.3s;border-radius:2px}
.quote-reveal.show .photo-frame{opacity:1;transform:translateY(0) scale(1)}
.q-text{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:clamp(1.05rem,4vw,1.5rem);color:#f5e6d0;line-height:1.75;max-width:480px;opacity:0;transform:translateY(12px);transition:opacity 1s ease 0.7s,transform 1s ease 0.7s}
.quote-reveal.show .q-text{opacity:1;transform:translateY(0)}
.q-tap{margin-top:28px;font-family:'Lato',sans-serif;font-weight:300;font-size:0.6rem;letter-spacing:0.45em;text-transform:uppercase;color:rgba(255,100,100,0.5);opacity:0;animation:tapBlink 2s ease infinite;transition:opacity 0.5s ease 1.5s}
.quote-reveal.show .q-tap{opacity:1}
@keyframes tapBlink{0%,100%{opacity:0.3}50%{opacity:0.8}}
.step-dots{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);display:flex;gap:8px;z-index:20}
.step-dot{width:6px;height:6px;border-radius:50%;background:rgba(255,100,100,0.2);transition:background 0.4s}
.step-dot.active{background:rgba(255,100,100,0.8)}

/* FINAL PAGE */
#final{position:fixed;inset:0;background:linear-gradient(135deg,#0d0005 0%,#1a0010 50%,#0d0005 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px 24px;opacity:0;pointer-events:none;transition:opacity 1.5s ease;overflow-y:auto;z-index:100}
#final.show{opacity:1;pointer-events:all}
.final-petals{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.fpetal{position:absolute;font-size:1.2rem;animation:ffall linear infinite;opacity:0}
@keyframes ffall{0%{transform:translateY(-30px) rotate(0deg);opacity:0.8}100%{transform:translateY(105vh) rotate(360deg);opacity:0}}
.final-inner{position:relative;z-index:1;width:100%;max-width:480px}
.bday-tag{font-family:'Lato',sans-serif;font-weight:300;letter-spacing:.5em;text-transform:uppercase;color:#e8a0b0;font-size:.65rem;opacity:0;animation:finalUp 1s ease both;animation-delay:.5s}
.bday-name{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:clamp(2.4rem,9vw,4.5rem);color:#fff;line-height:1.1;opacity:0;animation:finalUp 1.2s ease both;animation-delay:.9s;text-shadow:0 0 60px rgba(255,100,150,0.4)}
.bday-name span{color:#ff6b8a}
.bday-subtitle{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:1rem;color:rgba(255,220,230,0.7);margin-top:8px;opacity:0;animation:finalUp 1s ease both;animation-delay:1.3s}
.final-divider{display:flex;align-items:center;gap:12px;margin:24px auto;width:200px;opacity:0;animation:finalUp 1s ease both;animation-delay:1.6s}
.final-divider-line{flex:1;height:1px;background:#ff6b8a;opacity:.3}
.final-msg{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:clamp(.95rem,3vw,1.2rem);color:rgba(255,220,230,0.85);line-height:1.8;max-width:420px;opacity:0;animation:finalUp 1s ease both;animation-delay:1.9s}
.cd-label{font-family:'Lato',sans-serif;font-weight:300;letter-spacing:.4em;text-transform:uppercase;color:#ff6b8a;font-size:.6rem;margin-top:40px;margin-bottom:16px;opacity:0;animation:finalUp 1s ease both;animation-delay:2.3s}
.cd-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;max-width:340px;margin:0 auto;opacity:0;animation:finalUp 1s ease both;animation-delay:2.6s}
.cd-item{padding:14px 6px;border:1px solid rgba(255,107,138,.25);background:rgba(255,255,255,.03);text-align:center;position:relative}
.cd-item::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,#ff6b8a,transparent);opacity:.4}
.cd-num{font-family:'Cinzel',serif;font-size:1.8rem;color:#ff6b8a;display:block;line-height:1}
.cd-lbl{font-family:'Lato',sans-serif;font-weight:300;font-size:.5rem;letter-spacing:.3em;text-transform:uppercase;color:rgba(255,200,210,.5);margin-top:6px}
.final-closing{font-family:'Cinzel',serif;font-size:clamp(.85rem,2.5vw,1rem);color:#ff6b8a;margin-top:36px;letter-spacing:.08em;opacity:0;animation:finalUp 1s ease both;animation-delay:3s}
@keyframes finalUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}




.intro-text{position:absolute;bottom:18vh;left:50%;transform:translateX(-50%);text-align:center;width:90%;pointer-events:none}
.intro-title{font-family:'Lato',sans-serif;font-weight:700;font-size:clamp(1.1rem,5vw,1.5rem);color:#fff;background:rgba(30,30,30,0.85);border-radius:8px;padding:12px 20px;display:inline-block;margin-bottom:10px}
.intro-hint{font-family:'Lato',sans-serif;font-weight:300;font-size:0.65rem;letter-spacing:0.2em;color:rgba(255,255,255,0.6);background:rgba(60,60,60,0.7);border-radius:20px;padding:6px 16px;display:inline-block}
</style>
</head>

<div id="stage">
  <div class="intro-text" id="introText">
    <div class="intro-title">It's been 5 years of our relationship! 🎉</div><br/>
    <div class="intro-hint">To read more tap the red button</div>
  </div>
  <div id="dot" class="dot" onclick="dotClicked()"></div>
  <div id="quotePanel" class="quote-reveal">
    <img id="qPhoto" class="photo-frame" src="" alt=""/>
    <div id="qText" class="q-text"></div>
    <div class="q-tap">Click the dot to continue ●</div>
  </div>
  <div class="step-dots" id="stepDots"></div>
</div>

<div id="final">
  <div class="final-petals" id="finalPetals"></div>
  <div class="final-inner">
    <div class="bday-tag">10th June 2025</div>
    <div class="bday-name">Happy Birthday<br/><span>Kunju</span> 🎂</div>
    <div class="bday-subtitle">My favourite person in the whole world</div>
    <div class="final-divider"><div class="final-divider-line"></div><span style="color:#ff6b8a">♥</span><div class="final-divider-line"></div></div>
    <div class="final-msg" id="finalMsg"></div>
    <div class="cd-label">Counting down to our Wedding 💍</div>
    <div class="cd-grid">
      <div class="cd-item"><span class="cd-num" id="cd-d">00</span><span class="cd-lbl">Days</span></div>
      <div class="cd-item"><span class="cd-num" id="cd-h">00</span><span class="cd-lbl">Hours</span></div>
      <div class="cd-item"><span class="cd-num" id="cd-m">00</span><span class="cd-lbl">Mins</span></div>
      <div class="cd-item"><span class="cd-num" id="cd-s">00</span><span class="cd-lbl">Secs</span></div>
    </div>
    <div class="final-closing">Thanveer Mirza &nbsp;♥&nbsp; Alfiya Muhammad</div>
  </div>
</div>

let step = 0, phase = 'dot';
const TOTAL = QUOTE_BANKS.length;
const seed = Date.now();
const QUOTES = QUOTE_BANKS.map(b => b[Math.floor((seed / 1000 + b.length) % b.length)]);
const FINAL_MSG = FINAL_MSGS[Math.floor((seed / 1000) % FINAL_MSGS.length)];

const dotsEl = document.getElementById('stepDots');
for(let i=0;i<TOTAL;i++){const d=document.createElement('div');d.className='step-dot'+(i===0?' active':'');d.id='sd'+i;dotsEl.appendChild(d);}

function updateDots(){for(let i=0;i<TOTAL;i++)document.getElementById('sd'+i).classList.toggle('active',i===step);}

// Random positions avoiding center (where photo+text are)
const DOT_POSITIONS = [
  {x:15, y:20}, {x:75, y:15}, {x:85, y:70}, {x:10, y:75},
  {x:80, y:40}, {x:20, y:55}, {x:60, y:85}, {x:40, y:10},
  {x:88, y:88}, {x:12, y:90},
];
let posIndex = 0;

function getNextDotPos(){
  const pos = DOT_POSITIONS[posIndex % DOT_POSITIONS.length];
  posIndex++;
  return pos;
}

let moveInterval = null;

function placeDot(x, y, animate){
  const dot = document.getElementById('dot');
  dot.style.transition = 'none';
  dot.style.left = x + 'vw';
  dot.style.top  = y + 'vh';
  dot.style.transform = 'translate(-50%,-50%)';
  if(animate){
    dot.style.opacity='0'; dot.style.animation='none';
    void dot.offsetWidth;
    dot.style.animation='dotPulse 1.8s ease forwards';
  } else {
    dot.style.opacity='1';
    dot.style.animation='dotGlow 2s ease infinite';
  }
}

function startMovingDot(){
  stopMovingDot();
  moveInterval = setInterval(() => {
    if(phase === 'waitDot' || phase === 'intro' || phase === 'reading'){
      const dot = document.getElementById('dot');
      const mx = 10, my = 10;
      const x = mx + Math.random() * (100 - 2*mx);
      const y = my + Math.random() * (85 - 2*my);
      dot.style.transition = 'left 0.3s ease, top 0.3s ease';
      dot.style.left = x + 'vw';
      dot.style.top  = y + 'vh';
    }
  }, 3000);
}

function stopMovingDot(){
  if(moveInterval){ clearInterval(moveInterval); moveInterval = null; }
}

function showIntroScreen(){
  placeDot(50, 38, true);
  phase = 'intro';
  setTimeout(startMovingDot, 2000);
}

function playMusic(){
  const m = document.getElementById('bg-music');
  if(m && m.paused){ m.volume=0.8; m.play().catch(()=>{}); }
}

function dotClicked(){
  playMusic();
  // Hide intro text on first click
  const intro = document.getElementById('introText');
  if(intro){ intro.style.opacity='0'; setTimeout(()=>intro.style.display='none',500); }

  if(phase === 'intro' || phase === 'waitDot'){
    // Check if all quotes done
    if(step >= TOTAL){ showFinal(); return; }
    // Show the quote for current step
    const pos = getNextDotPos();
    placeDot(pos.x, pos.y, false);

    const panel = document.getElementById('quotePanel');
    panel.classList.remove('show');
    void panel.offsetWidth;
    document.getElementById('qPhoto').src = PHOTOS[step % PHOTOS.length];
    document.getElementById('qText').textContent = QUOTES[step];
    panel.classList.add('show');
    phase = 'reading';
    updateDots();

    // After short delay move dot to new random spot
    setTimeout(() => {
      if(phase === 'reading'){
        const np = getNextDotPos();
        placeDot(np.x, np.y, true);
        phase = 'waitDot';
        step++;
      }
    }, 800);

  } else if(phase === 'reading'){
    // Dot clicked while reading — skip to next
    if(step >= TOTAL){ showFinal(); return; }
    const pos = getNextDotPos();
    placeDot(pos.x, pos.y, false);
    const panel = document.getElementById('quotePanel');
    panel.classList.remove('show');
    void panel.offsetWidth;
    document.getElementById('qPhoto').src = PHOTOS[step % PHOTOS.length];
    document.getElementById('qText').textContent = QUOTES[step];
    panel.classList.add('show');
    updateDots();
    setTimeout(() => {
      const np = getNextDotPos();
      placeDot(np.x, np.y, true);
      phase = 'waitDot';
      step++;
    }, 800);
  }
}

function handleClick(){ /* disabled — only dot click works */ }

function showFinal(){
  stopMovingDot();
  document.getElementById('stage').style.display='none';
  const fin=document.getElementById('final');fin.classList.add('show');
  document.getElementById('finalMsg').innerHTML=FINAL_MSG;
  spawnPetals();updateCD();setInterval(updateCD,1000);
}

function updateCD(){
  const diff=new Date('2026-08-16T11:00:00')-new Date();
  if(diff<=0)return;
  document.getElementById('cd-d').textContent=String(Math.floor(diff/86400000)).padStart(2,'0');
  document.getElementById('cd-h').textContent=String(Math.floor((diff%86400000)/3600000)).padStart(2,'0');
  document.getElementById('cd-m').textContent=String(Math.floor((diff%3600000)/60000)).padStart(2,'0');
  document.getElementById('cd-s').textContent=String(Math.floor((diff%60000)/1000)).padStart(2,'0');
}

function spawnPetals(){
  const c=document.getElementById('finalPetals');
  ['🌸','🌺','✨','💫','🌹','💕'].forEach(e=>{for(let i=0;i<3;i++){const p=document.createElement('div');p.className='fpetal';p.textContent=e;p.style.left=Math.random()*100+'vw';p.style.animationDuration=(6+Math.random()*8)+'s';p.style.animationDelay=(Math.random()*8)+'s';c.appendChild(p);}});
}


showIntroScreen();
